name: Deploy MCP Server to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: intellireport-mcp
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create deployment package
        run: |
          tar -czf release.tar.gz \
            --exclude='.git' \
            --exclude='antenv' \
            --exclude='release.tar.gz' \
            .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Extract deployment package
        run: |
          mkdir app
          tar -xzf release.tar.gz -C app

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: 79b180b0-2274-4e8b-8e31-ee7db1b58c89
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: 76384605-20e8-4010-a7c1-a153bc100440

      - name: Enable Azure build
        run: |
          az webapp config appsettings set \
            --resource-group IntelliReport \
            --name intellireport-mcp \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./app
          startup-command: "bash startup.sh"
