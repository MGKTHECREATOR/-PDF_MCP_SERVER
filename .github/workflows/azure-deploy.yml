name: Deploy MCP Server to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: intellireport-mcp
  AZURE_RESOURCE_GROUP: IntelliReport
  PYTHON_VERSION: "3.12"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout the project
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 3. Validate that the project's dependencies can be installed
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Login to Azure using GitHub OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: 79b180b0-2274-4e8b-8e31-ee7db1b58c89
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: 76384605-20e8-4010-a7c1-a153bc100440

      # 5. Tell Azure App Service to install Python dependencies
      - name: Enable Azure build
        run: |
          az webapp config appsettings set \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

      # 6. Configure the MCP server startup command
      - name: Configure startup command
        run: |
          az webapp config set \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --startup-file "bash startup.sh"

      # 7. Deploy the complete project
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .

      # 8. Logout from Azure
      - name: Logout from Azure
        run: |
          az logout
